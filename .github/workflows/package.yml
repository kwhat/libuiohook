name: Nightly Build
on:
  push:
    branches:
      - '**'

jobs:
  catalyst-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: '-O2 -g -target arm64-apple-ios-macabi -miphoneos-version-min=13.1 -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-dead_strip_dylibs'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/catalyst/arm64 \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D USE_APPLICATION_SERVICES=OFF \
            -D USE_IOKIT=OFF \
            -D USE_APPKIT=OFF \
            -D BUILD_DEMO=OFF

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Verify binary architecture
        shell: bash
        run: |
          bash "${{github.workspace}}/.github/scripts/verify-binary-architecture.sh" \
            "${{github.workspace}}/dist/catalyst/arm64" arm64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  catalyst-x86_64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: '-O2 -g -target x86_64-apple-ios-macabi -miphoneos-version-min=13.1 -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-dead_strip_dylibs'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/catalyst/x86_64 \
            -D CMAKE_OSX_ARCHITECTURES=x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D USE_APPLICATION_SERVICES=OFF \
            -D USE_IOKIT=OFF \
            -D USE_APPKIT=OFF \
            -D BUILD_DEMO=OFF

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Verify binary architecture
        shell: bash
        run: |
          bash "${{github.workspace}}/.github/scripts/verify-binary-architecture.sh" \
            "${{github.workspace}}/dist/catalyst/x86_64" x86_64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true


  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: '-O2 -g -target arm64-apple-macos -mmacosx-version-min=10.5 -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-dead_strip_dylibs'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/macos/arm64 \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Verify binary architecture
        shell: bash
        run: |
          bash "${{github.workspace}}/.github/scripts/verify-binary-architecture.sh" \
            "${{github.workspace}}/dist/macos/arm64" arm64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  macos-x86_64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Compile
        env:
          CC: clang
          CFLAGS: '-O2 -g -target x86_64-apple-macos -mmacosx-version-min=10.5 -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-dead_strip_dylibs'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/macos/x86_64 \
            -D CMAKE_OSX_ARCHITECTURES=x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Verify binary architecture
        shell: bash
        run: |
          bash "${{github.workspace}}/.github/scripts/verify-binary-architecture.sh" \
            "${{github.workspace}}/dist/macos/x86_64" x86_64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true


  linux-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          # Keep native repositories so installed host packages retain matching candidates.
          host_arch=$(dpkg --print-architecture)
          for source_file in /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E "/^Architectures(-Add|-Remove)?:/d; /^Types:/a Architectures: $host_arch" "$source_file"
            fi
          done
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E "/^[[:space:]]*deb(-src)?[[:space:]]/ {
                s/arch(\+|-)?=[^][:space:]]+/arch=$host_arch/g
                /\[/ {
                  /arch=/!s/\[/[arch=$host_arch /
                  b
                }
                s/^([[:space:]]*deb(-src)?[[:space:]]+)/\1[arch=$host_arch] /
              }" "$source_file"
            fi
          done
          sudo bash -c 'source /etc/os-release && cat > /etc/apt/sources.list.d/libuiohook-armhf.list <<SOURCES
          deb [arch=armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main universe
          deb [arch=armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main universe
          deb [arch=armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main universe
          deb [arch=armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-backports main universe
          SOURCES'

          sudo dpkg --add-architecture armhf
          sudo apt-get update -m

          # APT can classify same-version metadata replacements as downgrades.
          # https://bugs.debian.org/1149125
          # GLib generators run on the host, including for target development packages.
          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            binutils-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabihf \
            libglib2.0-dev-bin:amd64 \
            libwayland-bin \
            wayland-protocols

          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            libglib2.0-dev-bin:amd64 \
            libevdev-dev:armhf \
            libinput-dev:armhf \
            libudev-dev:armhf \
            libwayland-dev:armhf \
            libx11-dev:armhf \
            libx11-xcb-dev:armhf \
            libxinerama-dev:armhf \
            libxkbcommon-dev:armhf \
            libxkbcommon-x11-dev:armhf

          # Newer Ubuntu releases package Gold separately for each cross target.
          gold_package=binutils-gold-arm-linux-gnueabihf
          if ! apt-cache show "$gold_package" >/dev/null 2>&1; then
            # Older cross-binutils packages include Gold themselves.
            gold_package=binutils-arm-linux-gnueabihf
          fi
          sudo apt-get install -y --allow-downgrades --no-install-recommends "$gold_package"
          arm-linux-gnueabihf-ld.gold --version

      - name: Compile
        env:
          CC: arm-linux-gnueabihf-gcc
          CFLAGS: '-Os -march=armv7ve -mfpu=vfp -mfloat-abi=hard -g -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-fuse-ld=gold -Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '/usr/lib/arm-linux-gnueabihf/pkgconfig'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/arm \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  linux-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          # Keep native repositories so installed host packages retain matching candidates.
          host_arch=$(dpkg --print-architecture)
          for source_file in /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E "/^Architectures(-Add|-Remove)?:/d; /^Types:/a Architectures: $host_arch" "$source_file"
            fi
          done
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E "/^[[:space:]]*deb(-src)?[[:space:]]/ {
                s/arch(\+|-)?=[^][:space:]]+/arch=$host_arch/g
                /\[/ {
                  /arch=/!s/\[/[arch=$host_arch /
                  b
                }
                s/^([[:space:]]*deb(-src)?[[:space:]]+)/\1[arch=$host_arch] /
              }" "$source_file"
            fi
          done
          sudo bash -c 'source /etc/os-release && cat > /etc/apt/sources.list.d/libuiohook-arm64.list <<SOURCES
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main universe
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main universe
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main universe
          deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-backports main universe
          SOURCES'

          sudo dpkg --add-architecture arm64
          sudo apt-get update -m

          # APT can classify same-version metadata replacements as downgrades.
          # https://bugs.debian.org/1149125
          # GLib generators run on the host, including for target development packages.
          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            libglib2.0-dev-bin:amd64 \
            libwayland-bin \
            wayland-protocols

          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            libglib2.0-dev-bin:amd64 \
            libevdev-dev:arm64 \
            libinput-dev:arm64 \
            libudev-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxinerama-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libxkbcommon-x11-dev:arm64

          # Newer Ubuntu releases package Gold separately for each cross target.
          gold_package=binutils-gold-aarch64-linux-gnu
          if ! apt-cache show "$gold_package" >/dev/null 2>&1; then
            # Older cross-binutils packages include Gold themselves.
            gold_package=binutils-aarch64-linux-gnu
          fi
          sudo apt-get install -y --allow-downgrades --no-install-recommends "$gold_package"
          aarch64-linux-gnu-ld.gold --version

      - name: Compile
        env:
          CC: aarch64-linux-gnu-gcc
          CFLAGS: '-Os -march=armv8-a+crc -mtune=cortex-a53 -g -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-fuse-ld=gold -Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '/usr/lib/aarch64-linux-gnu/pkgconfig'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  linux-x86:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          # Keep the runner's native mirrors and supplemental repositories.
          # Removing them can make installed packages newer than apt's candidates.
          sudo bash -c 'source /etc/os-release && cat > /etc/apt/sources.list.d/libuiohook-i386.list <<SOURCES
          deb [arch=i386 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu ${VERSION_CODENAME} main universe
          deb [arch=i386 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu ${VERSION_CODENAME}-updates main universe
          deb [arch=i386 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://security.ubuntu.com/ubuntu ${VERSION_CODENAME}-security main universe
          SOURCES'

          sudo dpkg --add-architecture i386
          sudo apt-get update

          # libinput-dev pulls GLib through libwacom. GLib generators run on
          # the amd64 host; select them before installing target development files.
          sudo apt-get install -y --no-install-recommends \
            binutils-i686-linux-gnu \
            gcc-i686-linux-gnu \
            libglib2.0-dev-bin:amd64 \
            libwayland-bin \
            wayland-protocols

          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev-bin:amd64 \
            libevdev-dev:i386 \
            libinput-dev:i386 \
            libudev-dev:i386 \
            libwayland-dev:i386 \
            libx11-dev:i386 \
            libx11-xcb-dev:i386 \
            libxinerama-dev:i386 \
            libxkbcommon-dev:i386 \
            libxkbcommon-x11-dev:i386

          sudo apt-get install -y --no-install-recommends binutils-gold

      - name: Compile
        env:
          CC: i686-linux-gnu-gcc
          CFLAGS: '-O2 -march=i686 -mtune=generic -g -fomit-frame-pointer -flto -fno-stack-protector -pipe'
          LDFLAGS: '-fuse-ld=gold -Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '/usr/lib/i386-linux-gnu/pkgconfig'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/x86 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevdev-dev:amd64 \
            libinput-dev:amd64 \
            libudev-dev:amd64 \
            libwayland-dev:amd64 \
            libwayland-bin \
            wayland-protocols \
            libx11-dev:amd64 \
            libx11-xcb-dev:amd64 \
            libxinerama-dev:amd64 \
            libxkbcommon-dev:amd64 \
            libxkbcommon-x11-dev:amd64

          sudo apt-get install -y --no-install-recommends binutils-gold

      - name: Compile
        env:
          CC: x86_64-linux-gnu-gcc
          CFLAGS: '-O2 -march=x86-64 -mtune=generic -g -fomit-frame-pointer -flto -fno-stack-protector -pipe'
          LDFLAGS: '-fuse-ld=gold -Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '/usr/lib/x86_64-linux-gnu/pkgconfig'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true


  windows-arm64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -A ARM64 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\arm64 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_SHARED_LIBS=ON ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -A Win32 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\x86 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_SHARED_LIBS=ON ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  windows-x86_64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -A x64 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\x86_64 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_SHARED_LIBS=ON ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true
