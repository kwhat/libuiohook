      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true


  linux-arm:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabihf \
            libwayland-bin \
            wayland-protocols
          sudo bash -s -- "$RUNNER_TEMP/armhf-sysroot" <<'ARMHF_SETUP'
          # Download an ARM32 development sysroot without installing foreign packages on
          # the runner. Host and ports mirrors can publish different glibc/GLib patches;
          # multiarch co-installation would require matching versions on both sides.
          set -euo pipefail

          sysroot=${1:?Missing ARM32 sysroot path}
          if [[ "$sysroot" != /* || "$sysroot" == / ]]; then
              echo "The sysroot must be an absolute directory other than /." >&2
              exit 1
          fi
          source /etc/os-release
          apt_workdir=$(mktemp -d)
          trap 'rm -rf "$apt_workdir"' EXIT
          chmod 755 "$apt_workdir"
          mkdir -p "$apt_workdir/lists/partial" "$apt_workdir/archives/partial" "$sysroot"
          touch "$apt_workdir/status"

          # Ubuntu's runtime loader is also addressed through /lib. Package extraction
          # does not run the filesystem setup that creates this merged-/usr alias.
          mkdir -p "$sysroot/usr/lib"
          if [[ ! -e "$sysroot/lib" && ! -L "$sysroot/lib" ]]; then
              ln -s usr/lib "$sysroot/lib"
          fi

          cat > "$apt_workdir/sources.list" <<SOURCES
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-updates main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME}-security main universe
          SOURCES

          apt_options=(
              -o APT::Architecture=armhf
              -o APT::Architectures::=armhf
              -o "Dir::State::status=$apt_workdir/status"
              -o "Dir::State::lists=$apt_workdir/lists"
              -o "Dir::Cache::archives=$apt_workdir/archives"
              -o "Dir::Etc::sourcelist=$apt_workdir/sources.list"
              -o Dir::Etc::sourceparts=-
          )
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" install -y --no-install-recommends --download-only \
              libevdev-dev libinput-dev libudev-dev libwayland-dev libwayland-bin \
              wayland-protocols libx11-dev libx11-xcb-dev libxinerama-dev \
              libxkbcommon-dev libxkbcommon-x11-dev

          # Package scripts and ARM tools are not executed; wayland-scanner runs on the
          # host. The target dependency graph is resolved against an empty package state.
          for archive in "$apt_workdir"/archives/*.deb; do
              dpkg-deb --extract "$archive" "$sysroot"
          done
          ARMHF_SETUP

      - name: Compile
        env:
          CC: arm-linux-gnueabihf-gcc
          CFLAGS: '-Os -march=armv7ve -mfpu=vfp -mfloat-abi=hard -g -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '${{ runner.temp }}/armhf-sysroot/usr/lib/arm-linux-gnueabihf/pkgconfig:${{ runner.temp }}/armhf-sysroot/usr/share/pkgconfig'
          PKG_CONFIG_SYSROOT_DIR: '${{ runner.temp }}/armhf-sysroot'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/arm \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D CMAKE_SYSROOT="$RUNNER_TEMP/armhf-sysroot" \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=arm \
            -D CMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -D CMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -D CMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  linux-arm64:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevdev-dev \
            libinput-dev \
            libudev-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libx11-xcb-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Compile
        env:
          CC: gcc
          CFLAGS: '-Os -march=armv8-a+crc -mtune=cortex-a53 -g -flto -fomit-frame-pointer -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-O1 -Wl,--as-needed'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/arm64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  linux-x86:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          # Keep the runner's native mirrors and supplemental repositories.
          # Removing them can make installed packages newer than apt's candidates.
          sudo bash -c 'source /etc/os-release && cat > /etc/apt/sources.list.d/libuiohook-i386.list <<SOURCES
          deb [arch=i386 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu ${VERSION_CODENAME} main universe
          deb [arch=i386 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu ${VERSION_CODENAME}-updates main universe
          deb [arch=i386 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://security.ubuntu.com/ubuntu ${VERSION_CODENAME}-security main universe
          SOURCES'

          sudo dpkg --add-architecture i386
          sudo apt-get update

          # libinput-dev pulls GLib through libwacom. GLib generators run on
          # the amd64 host; select them before installing target development files.
          sudo apt-get install -y --no-install-recommends \
            binutils-i686-linux-gnu \
            gcc-i686-linux-gnu \
            libglib2.0-dev-bin:amd64 \
            libwayland-bin \
            wayland-protocols

          sudo apt-get install -y --no-install-recommends \
            libevdev-dev:i386 \
            libinput-dev:i386 \
            libudev-dev:i386 \
            libwayland-dev:i386 \
            libx11-dev:i386 \
            libx11-xcb-dev:i386 \
            libxinerama-dev:i386 \
            libxkbcommon-dev:i386 \
            libxkbcommon-x11-dev:i386

      - name: Compile
        env:
          CC: i686-linux-gnu-gcc
          CFLAGS: '-O2 -march=i686 -mtune=generic -g -fomit-frame-pointer -flto -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '/usr/lib/i386-linux-gnu/pkgconfig'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/x86 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  linux-x86_64:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevdev-dev:amd64 \
            libinput-dev:amd64 \
            libudev-dev:amd64 \
            libwayland-dev:amd64 \
            libwayland-bin \
            wayland-protocols \
            libx11-dev:amd64 \
            libx11-xcb-dev:amd64 \
            libxinerama-dev:amd64 \
            libxkbcommon-dev:amd64 \
            libxkbcommon-x11-dev:amd64

      - name: Compile
        env:
          CC: x86_64-linux-gnu-gcc
          CFLAGS: '-O2 -march=x86-64 -mtune=generic -g -fomit-frame-pointer -flto -fno-stack-protector -pipe'
          LDFLAGS: '-Wl,-O1 -Wl,--as-needed'
          PKG_CONFIG_PATH: '/usr/lib/x86_64-linux-gnu/pkgconfig'
        shell: bash
        run: |
          cmake -B ${{github.workspace}}/build \
            -G "Unix Makefiles" \
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/dist/linux/x86_64 \
            -D CMAKE_VERBOSE_MAKEFILE=true \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}/build \
            --parallel 2 \
            --config RelWithDebInfo \
            --clean-first

          cmake --install ${{github.workspace}}/build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true


  windows-arm64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -A ARM64 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\arm64 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_SHARED_LIBS=ON ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -A Win32 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\x86 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_SHARED_LIBS=ON ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true

  windows-x86_64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Compile
        shell: cmd
        run: |
          cmake -B ${{github.workspace}}\build ^
            -A x64 ^
            -D CMAKE_INSTALL_PREFIX=${{github.workspace}}\dist\windows\x86_64 ^
            -D CMAKE_VERBOSE_MAKEFILE=true ^
            -D BUILD_SHARED_LIBS=ON ^
            -D BUILD_DEMO=ON

          cmake --build ${{github.workspace}}\build ^
            --parallel 2 ^
            --config RelWithDebInfo ^
            --clean-first

          cmake --install ${{github.workspace}}\build --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.job}}
          path: ${{github.workspace}}/dist/**/*
          overwrite: true
